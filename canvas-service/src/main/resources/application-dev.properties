server.port=8082
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/canvas_db
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.data.redis.host=localhost
spring.data.redis.port=6379
cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
auth-service.base-url=http://localhost:8081
chat-service.base-url=http://localhost:8083
canvas.default-templates.width=64
canvas.default-templates.height=64
spring.config.import=optional:classpath:application-dev-local.properties
